name: Bug Report
description: Report a reproducible bug to help us improve Study Flow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Bug summary
      placeholder: Short description of the issue
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact steps so we can reproduce.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Scroll ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11, Chrome 123, Mobile/Desktop

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Paste screenshots, console errors, or logs if available.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
